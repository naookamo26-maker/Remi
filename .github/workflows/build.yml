name: Build

# Windows向けの配布物(zip)を作り、成果物としてアップロードする
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: 依存ライブラリ
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ビルド
        run: python tools/build.py
      - name: 起動の確認(exe がインポートエラーなしで起動できるか)
        run: |
          $p = Start-Process -FilePath dist\Remi\Remi.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Remi-windows
          path: dist/Remi-*-win64.zip
