name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: 依存ライブラリ
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 画面テスト用のブラウザ(Playwright Chromium)
        run: python -m playwright install --with-deps chromium
      - name: テスト
        run: python -m pytest -v --durations=15
