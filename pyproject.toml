[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remi"
dynamic = ["version"]
description = "Redmineのチケットをチャット感覚で監視・コメントできるWindows向けデスクトップアプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials>=6.8",
    "requests>=2.32",
    "truststore>=0.10",
    "keyring>=25",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "textile>=4.0.3",
    "nh3>=0.2.18",
    "Pygments>=2.18",
]

[project.scripts]
remi = "remi.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "remi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remi = ["i18n/*.qm", "ui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
