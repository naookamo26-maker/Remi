name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Qtの実行に必要なライブラリ(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: 依存ライブラリ
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 翻訳の確認とビルド
        run: |
          python tools/i18n.py check
          python tools/i18n.py build
      - name: テスト
        run: python -m pytest
